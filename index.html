<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unlock Your Birthday Gifts 🎁</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      font-family: 'Poppins', sans-serif;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    h1 {
      color: #fff;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
      margin-bottom: 8px;
      text-align: center;
      z-index: 10;
    }

    p.subtitle {
      color: #6a4c59;
      margin-bottom: 30px;
      font-weight: 600;
      text-align: center;
      z-index: 10;
    }

    /* --- BALLOON ANIMATIONS & STYLING --- */
    .balloon-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .balloon {
      position: absolute;
      width: 50px;
      height: 100px;
      opacity: 0.85;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(-3deg); }
      50% { transform: translateY(50vh) rotate(3deg); }
      100% { transform: translateY(-120px) rotate(-3deg); }
    }

    /* Staggered Balloon Positions */
    .l-1  { left: 2%;  animation-duration: 5.0s !important; animation-delay: 0.1s !important; }
    .l-2  { left: 8%;  animation-duration: 7.2s !important; animation-delay: 1.2s !important; }
    .l-3  { left: 14%; animation-duration: 6.1s !important; animation-delay: 0.4s !important; }
    .l-4  { left: 20%; animation-duration: 8.0s !important; animation-delay: 2.1s !important; }
    .l-5  { left: 26%; animation-duration: 5.5s !important; animation-delay: 0.8s !important; }
    .l-6  { left: 32%; animation-duration: 6.8s !important; animation-delay: 1.5s !important; }
    .l-7  { left: 38%; animation-duration: 7.5s !important; animation-delay: 0.3s !important; }
    .r-1  { right: 2%;  animation-duration: 5.3s !important; animation-delay: 0.2s !important; }
    .r-2  { right: 8%;  animation-duration: 6.7s !important; animation-delay: 1.3s !important; }
    .r-3  { right: 14%; animation-duration: 7.3s !important; animation-delay: 0.5s !important; }
    .r-4  { right: 20%; animation-duration: 5.7s !important; animation-delay: 1.8s !important; }
    .r-5  { right: 26%; animation-duration: 6.2s !important; animation-delay: 0.9s !important; }
    .r-6  { right: 32%; animation-duration: 7.6s !important; animation-delay: 2.0s !important; }
    .r-7  { right: 38%; animation-duration: 5.1s !important; animation-delay: 0.4s !important; }

    /* --- GIFT GRID (2x2 Layout) --- */
    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      max-width: 500px;
      width: 100%;
      z-index: 10;
    }

    .gift-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      padding: 25px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.3s ease;
      text-align: center;
      min-height: 180px;
      position: relative;
      backdrop-filter: blur(4px);
    }

    .gift-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }

    .gift-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    .gift-title {
      font-weight: 700;
      color: #4a4a4a;
      font-size: 1.1rem;
    }

    .gift-status {
      font-size: 0.85rem;
      color: #ff4757;
      font-weight: 600;
      margin-top: 4px;
    }

    .gift-card.unlocked {
      background: #ffffff;
      border: 2px solid #ff6b81;
    }

    .gift-card.unlocked .gift-status {
      color: #2ed573;
    }

    .reward-content {
      font-size: 0.95rem;
      color: #333;
      margin-top: 8px;
      font-weight: 600;
      word-break: break-word;
    }

    /* --- FINAL GRAND GIFT / SURPRISE SECTION (Appears when all questions end) --- */
    .final-gift-section {
      display: none;
      margin-top: 35px;
      max-width: 500px;
      width: 100%;
      background: #ffffff;
      border-radius: 25px;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(255, 71, 87, 0.25);
      border: 3px dashed #ff4757;
      z-index: 10;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .final-gift-section.active {
      display: block;
    }

    .final-gift-section h2 {
      color: #ff4757;
      font-size: 1.5rem;
      margin-bottom: 10px;
    }

    .final-gift-section p {
      color: #4a4a4a;
      font-size: 1rem;
      line-height: 1.5;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* --- MODAL POPUP STYLING --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: white;
      padding: 30px 25px;
      border-radius: 25px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.2);
      text-align: center;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal h3 {
      color: #ff4757;
      margin-bottom: 12px;
      font-size: 1.2rem;
    }

    .modal p {
      color: #555;
      font-size: 1rem;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .modal input {
      width: 100%;
      padding: 12px 18px;
      border-radius: 20px;
      border: 2px solid #ff6b81;
      outline: none;
      font-size: 16px;
      text-align: center;
      margin-bottom: 15px;
      font-family: inherit;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s ease, transform 0.1s ease;
      font-family: inherit;
    }

    .btn-submit {
      background: #ff6b81;
      color: white;
    }

    .btn-submit:hover {
      background: #ff4757;
    }

    .btn-cancel {
      background: #e0e0e0;
      color: #555;
    }

    .btn-cancel:hover {
      background: #d6d6d6;
    }

    .error-msg {
      color: #ff4757;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: -8px;
      margin-bottom: 12px;
      display: none;
    }

    @media (max-width: 420px) {
      .gifts-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- FLOATING BALLOONS BACKGROUND -->
  <div class="balloon-container">
    <svg class="balloon l-1" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ff6b81" /><path d="M50,102 Q45,140 50,200" stroke="#ffb3bc" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon l-2" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ffb3bc" /><path d="M50,102 Q55,140 50,200" stroke="#ffd2d7" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon l-3" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ff4757" /><path d="M50,102 Q45,140 50,200" stroke="#ffb3bc" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon l-4" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#fff0f2" /><path d="M50,102 Q55,140 50,200" stroke="#ffd2d7" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon l-5" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ff6b81" /><path d="M50,102 Q45,140 50,200" stroke="#ffb3bc" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon l-6" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ffb3bc" /><path d="M50,102 Q55,140 50,200" stroke="#ffd2d7" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon l-7" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ff4757" /><path d="M50,102 Q45,140 50,200" stroke="#ffb3bc" stroke-width="1.5" fill="none" /></svg>
    
    <svg class="balloon r-1" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ff4757" /><path d="M50,102 Q45,140 50,200" stroke="#ffb3bc" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon r-2" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#fff0f2" /><path d="M50,102 Q55,140 50,200" stroke="#ffd2d7" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon r-3" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ff6b81" /><path d="M50,102 Q45,140 50,200" stroke="#ffb3bc" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon r-4" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ffb3bc" /><path d="M50,102 Q55,140 50,200" stroke="#ffd2d7" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon r-5" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ff4757" /><path d="M50,102 Q45,140 50,200" stroke="#ffb3bc" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon r-6" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#fff0f2" /><path d="M50,102 Q55,140 50,200" stroke="#ffd2d7" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon r-7" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ff6b81" /><path d="M50,102 Q45,140 50,200" stroke="#ffb3bc" stroke-width="1.5" fill="none" /></svg>
  </div>

  <h1>Unlock Your Gifts 🔒</h1>
  <p class="subtitle">Answer the question for each gift to reveal your surprise!</p>

  <div class="gifts-grid" id="giftsGrid">
    <!-- Cards rendered dynamically -->
  </div>

  <!-- GRAND FINAL GIFT SECTION (Revealed automatically once all 4 questions are answered) -->
  <div class="final-gift-section" id="finalGiftSection">
    <h2>🎉 All Gifts Unlocked! 🎉</h2>
    <p>You answered all the questions correctly! Here is your final surprise grand prize 🎁✨</p>
  </div>

  <!-- Question Popup Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalGiftTitle">Gift #1 Question</h3>
      <p id="modalQuestionText">Question text goes here?</p>
      <input type="text" id="answerInput" placeholder="Type your answer..." />
      <div class="error-msg" id="errorMsg">Incorrect answer! Try again 😜</div>
      <div class="modal-buttons">
        <button class="btn btn-submit" onclick="submitAnswer()">Unlock 🔓</button>
        <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const giftsData = [
      {
        id: 1,
        title: "Gift 1",
        question: "Where did we first meet?",
        answer: "cafe",
        reward: "☕ A cozy coffee date on me!",
        isUnlocked: false
      },
      {
        id: 2,
        title: "Gift 2",
        question: "What is my favorite nickname for you?",
        answer: "cutie",
        reward: "💌 A handwritten letter with a custom playlist!",
        isUnlocked: false
      },
      {
        id: 3,
        title: "Gift 3",
        question: "What is our favorite show to watch together?",
        answer: "supernatural",
        reward: "🎬 Movie night coupon with unlimited snacks!",
        isUnlocked: false
      },
      {
        id: 4,
        title: "Gift 4",
        question: "What is the secret word?",
        answer: "forever",
        reward: "🎁 The physical gift hidden in your closet!",
        isUnlocked: false
      }
    ];

    let currentGiftIndex = null;

    function renderGifts() {
      const grid = document.getElementById('giftsGrid');
      grid.innerHTML = '';

      giftsData.forEach((gift, index) => {
        const card = document.createElement('div');
        card.className = `gift-card ${gift.isUnlocked ? 'unlocked' : ''}`;
        card.onclick = () => openModal(index);

        card.innerHTML = `
          <div class="gift-icon">${gift.isUnlocked ? '🎁' : '🔒'}</div>
          <div class="gift-title">${gift.title}</div>
          <div class="gift-status">${gift.isUnlocked ? 'Unlocked!' : 'Locked'}</div>
          ${gift.isUnlocked ? `<div class="reward-content">${gift.reward}</div>` : ''}
        `;

        grid.appendChild(card);
      });

      checkAllUnlocked();
    }

    function checkAllUnlocked() {
      const allUnlocked = giftsData.every(gift => gift.isUnlocked);
      if (allUnlocked) {
        document.getElementById('finalGiftSection').classList.add('active');
      }
    }

    function openModal(index) {
      const gift = giftsData[index];
      if (gift.isUnlocked) return;

      currentGiftIndex = index;
      document.getElementById('modalGiftTitle').innerText = gift.title;
      document.getElementById('modalQuestionText').innerText = gift.question;
      document.getElementById('answerInput').value = '';
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('modalOverlay').classList.add('active');
      
      setTimeout(() => document.getElementById('answerInput').focus(), 100);
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      currentGiftIndex = null;
    }

    function submitAnswer() {
      if (currentGiftIndex === null) return;

      const userTyped = document.getElementById('answerInput').value.trim().toLowerCase();
      const correctAnswer = giftsData[currentGiftIndex].answer.toLowerCase();
      const errorMsg = document.getElementById('errorMsg');

      if (userTyped === correctAnswer) {
        giftsData[currentGiftIndex].isUnlocked = true;
        closeModal();
        renderGifts();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    document.getElementById('answerInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        submitAnswer();
      }
    });

    renderGifts();
  </script>
</body>
</html>
