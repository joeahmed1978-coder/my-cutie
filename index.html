<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* --- RETRO PIXEL SUNSET STYLING --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: url('pixel-sky.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding: 30px 15px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    /* 1. Speech Bubble Style (Pointing Up) */
    .speech-bubble {
      background: white;
      padding: 18px 25px;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      font-size: 1.15rem;
      font-weight: 600;
      color: #4a4a4a;
      max-width: 320px;
      text-align: center;
      cursor: pointer;
      position: relative;
      margin-bottom: 20px;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 12px 0;
      border-style: solid;
      border-color: white transparent;
    }

    .speech-bubble:hover {
      transform: scale(1.03);
      background: #fdfdfd;
    }

    /* 2. Character & Cake Wrapper */
    .character-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .character {
      width: 230px;
      height: auto;
      object-fit: contain;
      user-select: none;
      cursor: pointer;
      animation:
        slideUpFade 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
        floatingAction 3.5s ease-in-out infinite 1.2s;
    }

    /* 🎂 Chocolate Cake Overlay */
   .cake-overlay {
  position: absolute;
  /* Tweak 'bottom' to raise or lower the cake into the character's hands */
  bottom: 35px; 
  left: 50%;
  /* Adjust scale(0.85) if you need the cake smaller or larger */
  transform: translateX(-50%) scale(0.85); 
  opacity: 0;
  transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.5s ease;
  z-index: 15;
  pointer-events: none;
  filter: drop-shadow(0px 8px 12px rgba(0, 0, 0, 0.25));
}

.cake-overlay.show-cake {
  /* This scale should match the scale above so it pops in smoothly */
  transform: translateX(-50%) scale(0.85); 
  opacity: 1;
}

    /* Flame Animation */
    @keyframes flameFlicker {
      0%, 100% { transform: scale(1) rotate(-2deg); opacity: 1; }
      50% { transform: scale(1.2) rotate(2deg); opacity: 0.85; }
    }

    .flame {
      animation: flameFlicker 0.5s infinite alternate ease-in-out;
      transform-origin: center bottom;
    }

    /* 3. Button Styling */
    .button-container {
      margin-top: 15px;
      z-index: 10;
    }

    .btn {
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      font-family: 'Poppins', sans-serif;
    }

    .yes-btn {
      background-color: #ff6b81;
      color: white;
    }

    .yes-btn:hover {
      background-color: #ff4757;
    }

    .no-btn {
      background-color: #e0e0e0;
      color: #333;
    }

    .no-btn:hover {
      background-color: #d6d6d6;
    }

    /* 4. Animations */
    @keyframes slideUpFade {
      0% { transform: translateY(150px) scale(0.8); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes floatingAction {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-18px) rotate(1deg); }
      100% { transform: translateY(0px); }
    }

    /* --- BALLOONS --- */
    .balloon-container {
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease-in-out;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .balloon-container.show-balloons {
      opacity: 1;
      pointer-events: auto;
    }

    .balloon {
      position: absolute;
      width: 50px;
      height: 100px;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .balloon-container.show-balloons .balloon {
      opacity: 0.85;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(-3deg); }
      50% { transform: translateY(50vh) rotate(3deg); }
      100% { transform: translateY(-120px) rotate(-3deg); }
    }

    /* Left Side Staggered Positions & Durations */
    .l-1  { left: 2%;  animation-duration: 5.0s !important; animation-delay: 0.1s !important; }
    .l-2  { left: 6%;  animation-duration: 7.2s !important; animation-delay: 1.2s !important; }
    .l-3  { left: 10%; animation-duration: 6.1s !important; animation-delay: 0.4s !important; }
    .l-4  { left: 14%; animation-duration: 8.0s !important; animation-delay: 2.1s !important; }

    .r-20 { right: 40%; animation-duration: 6.1s !important; animation-delay: 1.2s !important; }

    /* --- GIFTS SECTION STYLING --- */
    .gifts-section {
      display: none;
      width: 100%;
      max-width: 500px;
      margin-top: 25px;
      z-index: 10;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
    }

    .gift-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.3s ease;
      text-align: center;
      min-height: 160px;
      position: relative;
      backdrop-filter: blur(4px);
    }

    .gift-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.18);
    }

    .gift-icon {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    .gift-title {
      font-weight: 700;
      color: #4a4a4a;
      font-size: 1rem;
    }

    .gift-status {
      font-size: 0.85rem;
      color: #ff4757;
      font-weight: 600;
      margin-top: 4px;
    }

    .gift-card.unlocked {
      background: #ffffff;
      border: 2px solid #ff6b81;
    }

    .gift-card.unlocked .gift-status {
      color: #2ed573;
    }

    .reward-content {
      font-size: 0.9rem;
      color: #333;
      margin-top: 8px;
      font-weight: 600;
      word-break: break-word;
    }

    /* GRAND SURPRISE SECTION */
    .final-gift-section {
      display: none;
      margin-top: 25px;
      width: 100%;
      background: #ffffff;
      border-radius: 25px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(255, 71, 87, 0.25);
      border: 3px dashed #ff4757;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .final-gift-section.active {
      display: block;
    }

    .final-gift-section h2 {
      color: #ff4757;
      font-size: 1.4rem;
      margin-bottom: 8px;
    }

    .final-gift-section p {
      color: #4a4a4a;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* --- MODAL POPUP STYLING --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: white;
      padding: 25px 20px;
      border-radius: 25px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      text-align: center;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal h3 {
      color: #ff4757;
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .modal p {
      color: #555;
      font-size: 0.95rem;
      margin-bottom: 18px;
      line-height: 1.4;
    }

    .modal input {
      width: 100%;
      padding: 10px 15px;
      border-radius: 20px;
      border: 2px solid #ff6b81;
      outline: none;
      font-size: 15px;
      text-align: center;
      margin-bottom: 12px;
      font-family: inherit;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .modal-error-msg {
      color: #ff4757;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: -5px;
      margin-bottom: 10px;
      display: none;
    }

    @media (max-width: 420px) {
      .gifts-grid {
        grid-template-columns: 1fr;
      }
    }

    <svg class="balloon r-16" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ffb3bc" /><path d="M50,102 Q55,140 50,200" stroke="#ffd2d7" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon r-17" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ff4757" /><path d="M50,102 Q45,140 50,200" stroke="#ffb3bc" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon r-18" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#fff0f2" /><path d="M50,102 Q55,140 50,200" stroke="#ffd2d7" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon r-19" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ff6b81" /><path d="M50,102 Q45,140 50,200" stroke="#ffb3bc" stroke-width="1.5" fill="none" /></svg>
    <svg class="balloon r-20" viewBox="0 0 100 200"><path d="M50,10 C25,10 20,40 20,60 C20,85 40,95 48,98 L46,102 L54,102 L52,98 C60,95 80,85 80,60 C80,40 75,10 50,10 Z" fill="#ffb3bc" /><path d="M50,102 Q55,140 50,200" stroke="#ffd2d7" stroke-width="1.5" fill="none" /></svg>
  </div>

  <audio id="bgMusic" src="birthday-song.mp3" loop></audio>

  <!-- Container for Character, Speech Bubble, and Chocolate Cake -->
  <div class="container">
    <div class="speech-bubble" id="speechBubble" onclick="startQuestion()">
      Are you Malak? (click me to continue)
    </div>

    <div class="character-wrapper">
      <img
        src="cartoon-you.png"
        alt="Cartoon Me"
        class="character"
        id="myCharacter"
        onclick="startQuestion()"
      >

      <!-- Chocolate Cake overlay holding in character's hands -->
      <div id="cakeOverlay" class="cake-overlay">
        <svg width="150" height="150" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Plate -->
          <ellipse cx="70" cy="118" rx="58" ry="12" fill="#EAEAEA" stroke="#CCCCCC" stroke-width="2"/>

          <!-- Cake Bottom Chocolate Layer -->
          <path d="M22 88 C22 88 22 113 70 113 C118 113 118 88 118 88 L118 73 C118 73 70 83 22 73 Z" fill="#3B2219"/>

          <!-- Cream Layer -->
          <path d="M22 78 C22 78 70 88 118 78 L118 82 C118 82 70 92 22 82 Z" fill="#FFF8E7"/>

          <!-- Cake Top Chocolate Layer -->
          <path d="M22 63 C22 63 22 78 70 78 C118 78 118 63 118 63 L118 52 C118 52 70 62 22 52 Z" fill="#4A2A1E"/>

          <!-- Chocolate Dripping Frosting -->
          <path d="M22 52 C22 60 32 66 38 60 C44 54 48 66 58 63 C68 60 74 68 84 62 C94 56 98 66 104 60 C110 54 118 60 118 52 C118 44 96 40 70 40 C44 40 22 44 22 52 Z" fill="#28150D"/>

          <!-- Cream Puffs on Top -->
          <circle cx="35" cy="46" r="4" fill="#FFF8E7"/>
          <circle cx="105" cy="46" r="4" fill="#FFF8E7"/>

          <!-- Candle Sticks -->
          <line x1="58" y1="42" x2="58" y2="28" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
          <line x1="82" y1="42" x2="82" y2="28" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>

          <!-- "1" and "8" Candle Numbers -->
          <text x="52" y="27" font-family="'Poppins', sans-serif" font-weight="700" font-size="19" fill="#FF4757" text-anchor="middle">1</text>
          <text x="88" y="27" font-family="'Poppins', sans-serif" font-weight="700" font-size="19" fill="#FF4757" text-anchor="middle">8</text>

          <!-- Candle Flames -->
          <path class="flame" d="M52 6 C52 6 48 11 52 15 C56 11 52 6 52 6 Z" fill="#FF9F43"/>
          <path class="flame" d="M52 8 C52 8 50 11 52 13 C54 11 52 8 52 8 Z" fill="#FFDC60"/>

          <path class="flame" d="M88 6 C88 6 84 11 88 15 C92 11 88 6 88 6 Z" fill="#FF9F43"/>
          <path class="flame" d="M88 8 C88 8 86 11 88 13 C90 11 88 8 88 8 Z" fill="#FFDC60"/>
        </svg>
      </div>
    </div>

    <div class="button-container" id="buttonContainer" style="display: none; flex-direction: column; align-items: center; gap: 15px;">
      <div id="yesNoBox" style="display: flex; gap: 20px; align-items: center;">
        <button class="btn yes-btn" onclick="handleYes()">Yes</button>
        <button class="btn no-btn" id="noBtn" onclick="dodgeNo()">No</button>
      </div>

      <div id="textInputBox" style="display: none; flex-direction: column; align-items: center; gap: 10px;">
        <input
          type="text"
          id="answerInput"
          placeholder="Type your answer..."
          style="padding: 10px 15px; font-size: 16px; border-radius: 20px; border: 2px solid #ff6b81; outline: none; text-align: center; width: 220px;"
        >
        <button class="btn yes-btn" id="submitBtn" onclick="checkAnswer()">Submit</button>
        <p id="errorMsg" style="color: #ff4757; font-weight: bold; margin: 5px 0 0 0; font-size: 14px; display: none;"></p>
      </div>
    </div>
  </div>

  <!-- GIFTS SECTION (Revealed automatically after all questions finish) -->
  <div class="gifts-section" id="giftsSection">
    <div class="gifts-grid" id="giftsGrid">
      <!-- Gift Cards rendered dynamically via JS -->
    </div>

    <!-- GRAND FINAL SURPRISE SECTION -->
    <div class="final-gift-section" id="finalGiftSection">
      <h2>🎉 All Gifts Unlocked! 🎉</h2>
      <p>You answered all the gift questions correctly! Here is your final surprise grand prize 🎁✨</p>
    </div>
  </div>

  <!-- GIFT QUESTION POPUP MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalGiftTitle">Gift #1 Question</h3>
      <p id="modalQuestionText">Question text goes here?</p>
      <input type="text" id="giftAnswerInput" placeholder="Type your answer..." />
      <div class="modal-error-msg" id="modalErrorMsg">Incorrect answer! Try again 😜</div>
      <div class="modal-buttons">
        <button class="btn yes-btn" onclick="submitGiftAnswer()">Unlock 🔓</button>
        <button class="btn no-btn" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // --- STAGE 1: YES/NO QUESTIONS ---
   let isStarted = false; // 👈 Add this line here!
const yesNoQuestions = [
  "Are you really Malak?",
  "Are you ready to put that to the test? (don't you dare say no but you can try though)"
];
    let yesNoIndex = 0;
    let yesScale = 1.0;
    let noScale = 1.0;

    // --- STAGE 2: SEQUENCE (QUESTIONS & MESSAGES) ---
    const sequence = [
      { question: "how old is Malak turning today?", answer: "18" },
      { question: "mhmmm, that's easy to guess, iam not sure yet that you are Malak" },
      { question: "what is Malak's fav color", answer: "pink" },
      { question: "That's easy to guess too😒😒" },
      { question: "who is Malak's fav artist?", answer: "lana del rey" },
      { question: "ohhh you know that, you might actually be Malak but let's make sure" },
      { question: "what is the last thing i say to Malak everyday at the end of our chat?", answer: "goodnight cutie" },
      { question: "YOU ARE MALAK!! Happy birhtday cutie🥳🥳 welcome to my surprise for you❤️" },
      { question: "but this just the start, be ready for what i prepared for you in this surprise🙃" }
    ];
    let seqIndex = 0;

    // --- STAGE 3: GIFTS DATA ---
    const giftsData = [
      {
        id: 1,
        title: "Gift 1",
        question: "Where did we first meet?",
        answer: "cafe",
        reward: "☕ A cozy coffee date on me!",
        isUnlocked: false
      },
      {
        id: 2,
        title: "Gift 2",
        question: "What is my favorite nickname for you?",
        answer: "cutie",
        reward: "💌 A handwritten letter with a custom playlist!",
        isUnlocked: false
      },
      {
        id: 3,
        title: "Gift 3",
        question: "What is our favorite show to watch together?",
        answer: "supernatural",
        reward: "🎬 Movie night coupon with unlimited snacks!",
        isUnlocked: false
      },
      {
        id: 4,
        title: "Gift 4",
        question: "What is the secret word?",
        answer: "forever",
        reward: "🎁 The physical gift hidden in your closet!",
        isUnlocked: false
      }
    ];

    let currentGiftIndex = null;

  function startQuestion() {
  // 🛑 Stop the function if the quiz has already started
  if (isStarted) return; 
  isStarted = true;

  const bubble = document.getElementById('speechBubble');
  const container = document.getElementById('buttonContainer');
  const yesNoBox = document.getElementById('yesNoBox');
  const textInputBox = document.getElementById('textInputBox');
  const music = document.getElementById('bgMusic');

  if (music) {
    music.play().catch(e => console.log("Audio waiting for user click.", e));
  }

  yesNoIndex = 0;
  seqIndex = 0;
  yesScale = 1.0;
  noScale = 1.0;
  updateButtonScales();

  yesNoBox.style.display = 'flex';
  textInputBox.style.display = 'none';
  container.style.display = 'flex';

  bubble.innerHTML = yesNoQuestions[yesNoIndex];
}

    function updateButtonScales() {
      const yesBtn = document.querySelector('.yes-btn');
      const noBtn = document.getElementById('noBtn');
      yesBtn.style.transform = `scale(${yesScale})`;
      noBtn.style.transform = `scale(${noScale})`;
    }

    function dodgeNo() {
      const bubble = document.getElementById('speechBubble');
      yesScale += 0.25;
      noScale = Math.max(0.2, noScale - 0.2);
      updateButtonScales();

      const funnyResponses = [
        "Are you for real?!!!🫩🫩",
        "Just click yes already🙂",
        "There is no need to be stubborn😒😒 ",
        "Believe me it will not work😩😩",
        "just quit doing that!!",
        "Enough playing games and press yes ommmgg😩😩",
        "commmee onn, the no button has almost vanished",
        "Look how large the yes button is!!! just press it"
      ];
      bubble.innerHTML = funnyResponses[Math.floor(Math.random() * funnyResponses.length)];
    }

    function handleYes() {
      const bubble = document.getElementById('speechBubble');
      yesNoIndex++;
      yesScale = 1.0;
      noScale = 1.0;
      updateButtonScales();

      if (yesNoIndex < yesNoQuestions.length) {
        bubble.innerHTML = yesNoQuestions[yesNoIndex];
      } else {
        switchToSequence();
      }
    }

    function switchToSequence() {
      document.getElementById('yesNoBox').style.display = 'none';
      document.getElementById('textInputBox').style.display = 'flex';
      showStep();
    }

    function showStep() {
      const bubble = document.getElementById('speechBubble');
      const input = document.getElementById('answerInput');
      const submitBtn = document.getElementById('submitBtn');
      const errorMsg = document.getElementById('errorMsg');

      const currentItem = sequence[seqIndex];
      bubble.innerHTML = currentItem.question;
      errorMsg.style.display = "none";

      if (currentItem.answer) {
        input.style.display = "block";
        input.value = "";
        submitBtn.innerHTML = "Submit";
      } else {
        input.style.display = "none";
        submitBtn.innerHTML = "Next ➡️";
      }
    }

    function checkAnswer() {
      const currentItem = sequence[seqIndex];
      const input = document.getElementById('answerInput');
      const errorMsg = document.getElementById('errorMsg');

      if (currentItem.answer) {
        const userTyped = input.value.trim().toLowerCase();
        const correctAnswer = currentItem.answer.toLowerCase();

        if (userTyped === correctAnswer) {
          advanceSequence();
        } else {
          errorMsg.innerHTML = "Wrong answer! Try again 😜";
          errorMsg.style.display = "block";
        }
      } else {
        advanceSequence();
      }
    }

    function advanceSequence() {
      seqIndex++;
      if (seqIndex < sequence.length) {
        showStep();
      } else {
        // --- ALL QUESTIONS FINISHED ---
        document.getElementById('buttonContainer').style.display = 'none';
        document.getElementById('speechBubble').innerHTML = "Bingo! 🥳 You passed all the tests! Now click on the gift boxes below to unlock your surprises! 🎁✨";

        // 🎂 1. REVEAL CHOCOLATE CAKE WITH "18" CANDLE IN CHARACTER'S HANDS!
        const cakeOverlay = document.getElementById('cakeOverlay');
        if (cakeOverlay) {
          cakeOverlay.classList.add('show-cake');
        }

        // 2. Show Floating Balloons
        const balloonContainer = document.querySelector('.balloon-container');
        if (balloonContainer) {
          balloonContainer.classList.add('show-balloons');
        } else {
          document.querySelectorAll('.balloon').forEach(balloon => {
            balloon.classList.add('show-balloons');
          });
        }

        // 3. Show Gifts Section
        const giftsSection = document.getElementById('giftsSection');
        giftsSection.style.display = 'block';
        renderGifts();
      }
    }

    // --- GIFT CARDS RENDER & MODAL LOGIC ---
    function renderGifts() {
      const grid = document.getElementById('giftsGrid');
      grid.innerHTML = '';

      giftsData.forEach((gift, index) => {
        const card = document.createElement('div');
        card.className = `gift-card ${gift.isUnlocked ? 'unlocked' : ''}`;
        card.onclick = () => openModal(index);

        card.innerHTML = `
          <div class="gift-icon">${gift.isUnlocked ? '🎁' : '🔒'}</div>
          <div class="gift-title">${gift.title}</div>
          <div class="gift-status">${gift.isUnlocked ? 'Unlocked!' : 'Locked'}</div>
          ${gift.isUnlocked ? `<div class="reward-content">${gift.reward}</div>` : ''}
        `;

        grid.appendChild(card);
      });

      checkAllUnlocked();
    }

    function checkAllUnlocked() {
      const allUnlocked = giftsData.every(gift => gift.isUnlocked);
      if (allUnlocked) {
        document.getElementById('finalGiftSection').classList.add('active');
      }
    }

    function openModal(index) {
      const gift = giftsData[index];
      if (gift.isUnlocked) return;

      currentGiftIndex = index;
      document.getElementById('modalGiftTitle').innerText = gift.title;
      document.getElementById('modalQuestionText').innerText = gift.question;
      document.getElementById('giftAnswerInput').value = '';
      document.getElementById('modalErrorMsg').style.display = 'none';
      document.getElementById('modalOverlay').classList.add('active');
      
      setTimeout(() => document.getElementById('giftAnswerInput').focus(), 100);
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      currentGiftIndex = null;
    }

    function submitGiftAnswer() {
      if (currentGiftIndex === null) return;

      const userTyped = document.getElementById('giftAnswerInput').value.trim().toLowerCase();
      const correctAnswer = giftsData[currentGiftIndex].answer.toLowerCase();
      const errorMsg = document.getElementById('modalErrorMsg');

      if (userTyped === correctAnswer) {
        giftsData[currentGiftIndex].isUnlocked = true;
        closeModal();
        renderGifts();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const input = document.getElementById('answerInput');
      if (input) {
        input.addEventListener("keypress", (e) => {
          if (e.key === "Enter") checkAnswer();
        });
      }

      const giftInput = document.getElementById('giftAnswerInput');
      if (giftInput) {
        giftInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") submitGiftAnswer();
        });
      }
    });
  </script>
