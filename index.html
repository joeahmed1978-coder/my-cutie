  <style>
    /* Final Styling for the Cartoon Character Webpage */
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffe5ec, #ffc2d1); /* Warm, celebratory gradient */
      font-family: 'Poppins', sans-serif; /* Friendly font */
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    /* 1. Speech Bubble Style (Pointing Up) */
    .speech-bubble {
      background: white;
      padding: 18px 25px;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      font-size: 1.15rem;
      font-weight: 600;
      color: #4a4a4a;
      max-width: 280px;
      text-align: center;
      cursor: pointer;
      position: relative;
      margin-bottom: 20px; /* Space above character */
      transition: all 0.2s ease;
      z-index: 10;
    }

    /* Bubble triangle */
    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 12px 0;
      border-style: solid;
      border-color: white transparent;
    }

    .speech-bubble:hover {
      transform: scale(1.05);
      background: #fdfdfd;
    }

    /* 2. Character Image Styling (No Border) */
    .character {
      width: 250px; /* Perfect size for the full body cartoon */
      height: auto; /* Mantains original aspect ratio */
      object-fit: contain;
      user-select: none; /* Prevents selecting the image */
      transform: scale(3.0);
      /* Applying the entrance and idle animations */
      animation: 
        slideUpFade 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, 
        floatingAction 3.5s ease-in-out infinite 1.2s; 
    }

    /* 3. Animations */
    
    /* Smooth Entrance */
    @keyframes slideUpFade {
      0% { transform: translateY(150px) scale(0.8); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* Continuous Gentle Floating/Hopping */
    @keyframes floatingAction {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-18px) rotate(1deg); } /* Extra rotation adds dynamic feel */
      100% { transform: translateY(0px); }
    }

    /* Quick jump animation triggered by JS on click */
    @keyframes hop {
      0% { transform: translateY(0); }
      50% { transform: translateY(-50px) scale(1.05); }
      100% { transform: translateY(0); }
    }
    
    /* Background accents (optional hearts/stars) */
    .bg-accent {
      position: absolute;
      opacity: 0.2;
      animation: drift 10s linear infinite;
    }

    @keyframes drift {
      from { transform: translateY(0) rotate(0deg); }
      to { transform: translateY(-200px) rotate(360deg); }
    }
.button-container {
    margin-top: 50px;
    display: flex;
    gap: 20px;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 10;
  }

  .btn {
    padding: 12px 28px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  }

  .yes-btn {
    background-color: #ff6b81;
    color: white;
  }

  .yes-btn:hover {
    background-color: #ff4757;
    transform: scale(1.1);
  }

  .no-btn {
    background-color: #f1f2f6;
    color: #57606f;
    position: relative;
  }/* --- HEART BALLOONS STYLING --- */
.balloon-container {
  position: fixed;
  bottom: -10px;
  width: 100%;
  height: 100%;
  pointer-events: none; /* This makes sure you can still click your character and buttons! */
  z-index: 1; /* Keeps them in the background */
}

.balloon {
  position: absolute;
  width: 100px;
  height: auto;
  animation: floatBalloon 6s ease-in-out infinite;
}

/* Individual balloon positions and custom speeds */
.balloon-left-1 { left: 5%; bottom: 15%; animation-duration: 5s; }
.balloon-left-2 { left: 12%; bottom: 35%; animation-duration: 7s; animation-delay: 1s; }
/* --- NEW LEFT BALLOONS --- */
.balloon-left-3 { left: 2%; bottom: 45%; animation-duration: 6s; animation-delay: 0.5s; }
.balloon-left-4 { left: 18%; bottom: 20%; animation-duration: 8s; animation-delay: 2s; }

.balloon-right-1 { right: 5%; bottom: 20%; animation-duration: 5.5s; }
.balloon-right-2 { right: 15%; bottom: 40%; animation-duration: 6.5s; animation-delay: 1.5s; }
/* --- NEW RIGHT BALLOONS --- */
.balloon-right-3 { right: 2%; bottom: 50%; animation-duration: 7.5s; animation-delay: 0.3s; }
.balloon-right-4 { right: 20%; bottom: 25%; animation-duration: 5.8s; animation-delay: 2.2s; }

/* The gentle floating up and down animation */
@keyframes floatBalloon {
  0% {
    transform: translateY(0) rotate(-3deg);
  }
  50% {
    transform: translateY(-20px) rotate(3deg);
  }
  100% {
    transform: translateY(0) rotate(-3deg);
  }
}.balloon-right-2 { right: 15%; bottom: 40%; animation-duration: 6.5s; animation-delay: 1.5s; }

/* The gentle floating up and down animation */
@keyframes floatBalloon {
  0% {
    transform: translateY(0) rotate(-3deg);
  }
  50% {
    transform: translateY(-20px) rotate(3deg);
  }
  100% {
    transform: translateY(0) rotate(-3deg);
  } </style>

<audio id="bgMusic" src="birthday-song.mp3" loop></audio>
  <!-- Container for Character & Bubble -->
<div class="container">
  <!-- Speech Bubble -->
  <div class="speech-bubble" id="speechBubble">
    Are you Malak? (click me to continue)
  </div>

  <!-- Your Cartoon Character -->
  <img 
    src="cartoon-you.png" 
    alt="Cartoon Me" 
    class="character" 
    id="myCharacter"
    onclick="startQuestion()"
  >

  <!-- Yes/No Buttons (Hidden by default) -->
  <div class="button-container" id="buttonContainer" style="display: none; flex-direction: column; align-items: center; gap: 15px;">
  
  <!-- Yes / No Controls -->
  <div id="yesNoBox" style="display: flex; gap: 20px; align-items: center;">
    <button class="btn yes-btn" onclick="handleYes()">Yes</button>
    <button class="btn no-btn" id="noBtn" onclick="dodgeNo()">No</button>
  </div>

  <!-- Text Input Controls (Hidden initially) -->
  <div id="textInputBox" style="display: none; flex-direction: column; align-items: center; gap: 10px;">
    <input 
      type="text" 
      id="answerInput" 
      placeholder="Type your answer..." 
      style="padding: 10px 15px; font-size: 16px; border-radius: 20px; border: 2px solid #ff6b81; outline: none; text-align: center; width: 220px;"
    >
    <button class="btn yes-btn" onclick="checkAnswer()">Submit</button>
    <p id="errorMsg" style="color: #ff4757; font-weight: bold; margin: 5px 0 0 0; font-size: 14px; display: none;"></p>
  </div>

</div>

 <script>
  // --- STAGE 1: YES/NO QUESTIONS ---
  const yesNoQuestions = [
    "Are you really Malak?",
    "Are you ready to put that to the test? (don't you dare say no but you can try though)"
  ];
  let yesNoIndex = 0;
  let yesScale = 1.0;
  let noScale = 1.0;

  // --- STAGE 2: SEQUENCE (QUESTIONS & MESSAGES) ---
  // To add a simple message, just leave out the "answer" line!
  const sequence = [
    {
      question: "how old is Malak turning today?",
      answer: "18"
    },
    {
      question: "mhmmm, that's easy to guess, iam not sure yet that you are Malak"
      // No answer line needed for intermediate sentences!
    },
    {
      question: "what is the last thing i tell Malak everyday?",
      answer: "goodnight cutie"
    },
    {
      question: "You're doing amazing! Almost there... ✨"
    }
  ];
  let seqIndex = 0;

  function startQuestion() {
    const bubble = document.getElementById('speechBubble');
    const container = document.getElementById('buttonContainer');
    const yesNoBox = document.getElementById('yesNoBox');
    const textInputBox = document.getElementById('textInputBox');
    const music = document.getElementById('bgMusic');

    if (music) {
      music.play().catch(e => console.log("Audio waiting for user click.", e));
    }

    yesNoIndex = 0;
    seqIndex = 0;
    yesScale = 1.0;
    noScale = 1.0;
    updateButtonScales();

    yesNoBox.style.display = 'flex';
    textInputBox.style.display = 'none';
    container.style.display = 'flex';

    bubble.innerHTML = yesNoQuestions[yesNoIndex];
  }

  function updateButtonScales() {
    const yesBtn = document.querySelector('.yes-btn');
    const noBtn = document.getElementById('noBtn');
    yesBtn.style.transform = `scale(${yesScale})`;
    noBtn.style.transform = `scale(${noScale})`;
  }

  function dodgeNo() {
    const bubble = document.getElementById('speechBubble');
    yesScale += 0.25;
    noScale = Math.max(0.2, noScale - 0.2);
    updateButtonScales();

    const funnyResponses = [
      "Are you for real?!!!🫩🫩",
      "Just click yes already🙂",
      "There is no need to be stubborn😒😒 ",
      "Believe me it will not work😩😩"
    ];
    bubble.innerHTML = funnyResponses[Math.floor(Math.random() * funnyResponses.length)];
  }

  function handleYes() {
    const bubble = document.getElementById('speechBubble');
    yesNoIndex++;
    yesScale = 1.0;
    noScale = 1.0;
    updateButtonScales();

    if (yesNoIndex < yesNoQuestions.length) {
      bubble.innerHTML = yesNoQuestions[yesNoIndex];
    } else {
      switchToSequence();
    }
  }

  function switchToSequence() {
    document.getElementById('yesNoBox').style.display = 'none';
    document.getElementById('textInputBox').style.display = 'flex';
    showStep();
  }

  function showStep() {
    const bubble = document.getElementById('speechBubble');
    const input = document.getElementById('answerInput');
    const submitBtn = document.getElementById('submitBtn');
    const errorMsg = document.getElementById('errorMsg');

    const currentItem = sequence[seqIndex];
    bubble.innerHTML = currentItem.question;
    errorMsg.style.display = "none";

    // If it's a question with an answer
    if (currentItem.answer) {
      input.style.display = "block";
      input.value = "";
      submitBtn.innerHTML = "Submit";
    } else {
      // It's a sentence between questions!
      input.style.display = "none";
      submitBtn.innerHTML = "Next ➡️";
    }
  }

  function checkAnswer() {
    const currentItem = sequence[seqIndex];
    const input = document.getElementById('answerInput');
    const errorMsg = document.getElementById('errorMsg');

    if (currentItem.answer) {
      const userTyped = input.value.trim().toLowerCase();
      const correctAnswer = currentItem.answer.toLowerCase();

      if (userTyped === correctAnswer) {
        advanceSequence();
      } else {
        errorMsg.innerHTML = "Wrong answer! Try again 😜";
        errorMsg.style.display = "block";
      }
    } else {
      advanceSequence();
    }
  }

  function advanceSequence() {
    seqIndex++;
    if (seqIndex < sequence.length) {
      showStep();
    } else {
      document.getElementById('buttonContainer').style.display = 'none';
      document.getElementById('speechBubble').innerHTML = "Bingo! 🥳 You passed all the tests! Your first clue is hidden where you keep things cold... ❄️";
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById('answerInput');
    if (input) {
      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkAnswer();
      });
    }
  });
</script>
