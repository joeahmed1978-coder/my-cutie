<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎉</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* --- RETRO PIXEL SUNSET & BASE STYLING --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: url('pixel-sky.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      image-rendering: pixelated;
      font-family: 'Poppins', sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      position: relative;
      padding: 30px 15px;
      background-color: #120a08;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    /* 1. Speech Bubble Style */
    .speech-bubble {
      background: white;
      padding: 18px 25px;
      border-radius: 25px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      font-size: 1.15rem;
      font-weight: 600;
      color: #4a4a4a;
      max-width: 340px;
      text-align: center;
      cursor: pointer;
      position: relative;
      margin-bottom: 20px;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 12px 12px 0;
      border-style: solid;
      border-color: white transparent;
    }

    .speech-bubble:hover {
      transform: scale(1.03);
      background: #fdfdfd;
    }

    /* 2. Character & Cake Wrapper */
    .character-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .character {
      width: 230px;
      height: auto;
      object-fit: contain;
      user-select: none;
      cursor: pointer;
      animation:
        slideUpFade 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
        floatingAction 3.5s ease-in-out infinite 1.2s;
    }

    /* --- RICH CHOCOLATE 18TH BIRTHDAY CAKE STYLING --- */
    .cake-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 30px;
      transform: scale(0.85);
    }

    .candle-glow {
      position: absolute;
      top: -10px;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255, 185, 60, 0.35) 0%, rgba(255, 120, 0, 0.12) 50%, transparent 75%);
      pointer-events: none;
      border-radius: 50%;
      animation: ambientGlow 2s infinite alternate ease-in-out;
    }

    .top-decorations {
      position: relative;
      width: 180px;
      height: 75px;
      z-index: 10;
    }

    .candles-group {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 12;
    }

    .number-candle {
      position: relative;
      font-size: 44px;
      font-weight: 900;
      background: linear-gradient(180deg, #fff4b8 0%, #ffd700 50%, #b8860b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
      line-height: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .wick {
      width: 3px;
      height: 8px;
      background: #2b2b2b;
      margin-bottom: 2px;
      border-radius: 1px;
    }

    .flame {
      width: 14px;
      height: 24px;
      background: radial-gradient(ellipse at bottom, #ffffff 0%, #ffeb3b 25%, #ff9800 60%, rgba(255,87,34,0) 100%);
      border-radius: 50% 50% 35% 35%;
      box-shadow: 0 0 14px #ff9800, 0 0 28px #ff5722;
      animation: flameFlicker 0.15s infinite alternate ease-in-out;
      transform-origin: center bottom;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .flame.extinguished {
      opacity: 0 !important;
      transform: scale(0) !important;
    }

    .berry {
      position: absolute;
      width: 22px;
      height: 22px;
      background: radial-gradient(circle at 35% 35%, #ff3b5c, #b7094c 65%, #4a081a 100%);
      border-radius: 50%;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.6), 0 3px 6px rgba(0,0,0,0.5);
    }

    .berry-1 { bottom: 6px; left: 10px; width: 26px; height: 26px; }
    .berry-2 { bottom: 10px; right: 12px; width: 24px; height: 24px; }
    .berry-3 { bottom: 28px; left: 30px; width: 18px; height: 18px; }
    .berry-4 { bottom: 30px; right: 32px; width: 20px; height: 20px; }

    .curl {
      position: absolute;
      width: 22px;
      height: 14px;
      border: 3px solid #231108;
      border-bottom: none;
      border-radius: 12px 12px 0 0;
      box-shadow: 1px 2px 4px rgba(0,0,0,0.6);
    }
    .curl-1 { bottom: 12px; left: 44px; transform: rotate(-25deg); }
    .curl-2 { bottom: 14px; right: 46px; transform: rotate(30deg); }

    .tier {
      position: relative;
      background: linear-gradient(90deg, #24120a 0%, #3d1f13 40%, #4d2718 60%, #24120a 100%);
      border-radius: 8px 8px 4px 4px;
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.08), 0 8px 16px rgba(0,0,0,0.7);
    }

    .tier-top { width: 180px; height: 85px; z-index: 5; }
    .tier-bottom { width: 240px; height: 100px; z-index: 3; }

    .divider {
      width: 246px;
      height: 14px;
      background: linear-gradient(90deg, #180904 0%, #d90429 25%, #7209b7 50%, #d90429 75%, #180904 100%);
      margin: -4px 0;
      z-index: 4;
      border-radius: 7px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }

    .glaze {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 18px;
      background: #140703;
      border-radius: 8px 8px 0 0;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.15);
    }

    .drip-container {
      position: absolute;
      top: 16px;
      width: 100%;
      display: flex;
      justify-content: space-around;
    }

    .drip {
      background: #140703;
      border-radius: 0 0 10px 10px;
      box-shadow: 2px 3px 5px rgba(0,0,0,0.6);
    }

    .tier-top .drip:nth-child(1) { width: 16px; height: 30px; }
    .tier-top .drip:nth-child(2) { width: 14px; height: 20px; }
    .tier-top .drip:nth-child(3) { width: 18px; height: 38px; }
    .tier-top .drip:nth-child(4) { width: 15px; height: 24px; }
    .tier-top .drip:nth-child(5) { width: 17px; height: 34px; }

    .tier-bottom .drip:nth-child(1) { width: 20px; height: 42px; }
    .tier-bottom .drip:nth-child(2) { width: 16px; height: 24px; }
    .tier-bottom .drip:nth-child(3) { width: 22px; height: 48px; }
    .tier-bottom .drip:nth-child(4) { width: 18px; height: 28px; }
    .tier-bottom .drip:nth-child(5) { width: 20px; height: 38px; }
    .tier-bottom .drip:nth-child(6) { width: 15px; height: 22px; }

    .plate {
      width: 290px;
      height: 16px;
      background: linear-gradient(90deg, #777 0%, #ececec 50%, #888 100%);
      border-radius: 50%;
      margin-top: -6px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.9);
      z-index: 1;
    }

    .cake-overlay {
      margin-top: -10px;
      opacity: 0;
      transition: transform 0.6s ease, opacity 0.5s ease;
      z-index: 15;
    }

    .cake-overlay.show-cake {
      opacity: 1;
    }

    /* Smoke Particles */
    .smoke-particle {
      position: absolute;
      top: -20px;
      width: 10px;
      height: 10px;
      background: rgba(220, 220, 220, 0.8);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }

    .smoke-particle.active {
      animation: riseAndFade 2.2s forwards ease-out;
    }

    @keyframes riseAndFade {
      0% { opacity: 0.85; transform: translateY(0) scale(0.6); }
      50% { opacity: 0.5; transform: translateY(-30px) scale(1.6) translateX(4px); }
      100% { opacity: 0; transform: translateY(-60px) scale(2.8) translateX(-8px); }
    }

    /* 3. Button Styling */
    .button-container {
      margin-top: 15px;
      z-index: 10;
    }

    .btn, .action-btn {
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      transition: transform 0.25s ease, opacity 0.25s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      font-family: 'Poppins', sans-serif;
    }

    .yes-btn, .action-btn {
      background-color: #ff6b81;
      color: white;
    }

    .yes-btn:hover, .action-btn:hover {
      background-color: #ff4757;
      transform: scale(1.05);
    }

    .blow-btn {
      background: linear-gradient(135deg, #ff9f43, #ff5252);
      color: white;
      font-size: 1.05rem;
      padding: 12px 28px;
      border-radius: 25px;
      animation: pulseGlow 1.5s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 10px rgba(255, 159, 67, 0.5); transform: scale(1); }
      100% { box-shadow: 0 0 25px rgba(255, 82, 82, 0.85); transform: scale(1.05); }
    }

    .no-btn {
      background-color: #e0e0e0;
      color: #333;
    }

    .no-btn:hover {
      background-color: #d6d6d6;
    }

    /* 🎂 CAKE TABLE & RECORD STAGE CSS */
    #cakeTableStage {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
      z-index: 10;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .table-scene {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin: 20px auto 25px auto;
    }

    .table-surface {
      position: relative;
      width: 420px;
      height: 90px;
      background: linear-gradient(180deg, #9b6233 0%, #6e401b 100%);
      border-radius: 16px 16px 6px 6px;
      box-shadow: inset 0 8px 0 #b3743f, 0 15px 30px rgba(0,0,0,0.35);
      display: flex;
      justify-content: space-around;
      align-items: flex-start;
    }

    .table-cake {
      position: absolute;
      top: -210px;
      left: -10px;
      user-select: none;
    }

    .record-player {
      position: absolute;
      top: -55px;
      right: 25px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s ease;
      user-select: none;
    }

    .record-player:hover {
      transform: scale(1.08);
    }

    .vinyl-disc {
      width: 72px;
      height: 72px;
      background: radial-gradient(circle, #333 20%, #111 21%, #222 40%, #111 41%, #222 70%, #000 100%);
      border: 3px solid #444;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: #fff;
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
      margin: 0 auto;
    }

    .vinyl-disc.playing {
      animation: spinRecord 2s linear infinite;
    }

    @keyframes spinRecord {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .record-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #333;
      margin-top: 6px;
      background: rgba(255, 255, 255, 0.95);
      padding: 4px 10px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .stage-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      margin-top: 15px;
    }

    /* Keyframe Animations */
    @keyframes flameFlicker {
      0% { transform: scale(1) rotate(-1.5deg); }
      100% { transform: scale(1.08) rotate(2deg); }
    }

    @keyframes ambientGlow {
      0% { opacity: 0.8; transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1.03); }
    }

    @keyframes slideUpFade {
      0% { transform: translateY(150px) scale(0.8); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes floatingAction {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-18px) rotate(1deg); }
      100% { transform: translateY(0px); }
    }

    /* --- BALLOONS --- */
    .balloon-container {
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s ease-in-out;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    .balloon-container.show-balloons {
      opacity: 1;
      pointer-events: auto;
    }

    .balloon {
      position: absolute;
      width: 50px;
      height: 100px;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .balloon-container.show-balloons .balloon {
      opacity: 0.85;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(-3deg); }
      50% { transform: translateY(50vh) rotate(3deg); }
      100% { transform: translateY(-120px) rotate(-3deg); }
    }

    .l-1  { left: 2%;  animation-duration: 5.0s !important; animation-delay: 0.1s !important; }
    .l-2  { left: 6%;  animation-duration: 7.2s !important; animation-delay: 1.2s !important; }
    .l-3  { left: 10%; animation-duration: 6.1s !important; animation-delay: 0.4s !important; }
    .r-1  { right: 2%;  animation-duration: 5.3s !important; animation-delay: 0.2s !important; }
    .r-2  { right: 6%;  animation-duration: 6.7s !important; animation-delay: 1.3s !important; }

    /* --- GIFTS SECTION STYLING --- */
    .gifts-section {
      display: none;
      width: 100%;
      max-width: 500px;
      margin-top: 25px;
      z-index: 10;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .gifts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      width: 100%;
    }

    .gift-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 20px;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.3s ease;
      text-align: center;
      min-height: 160px;
      backdrop-filter: blur(4px);
    }

    .gift-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.18);
    }

    .gift-icon { font-size: 3rem; margin-bottom: 8px; }
    .gift-title { font-weight: 700; color: #4a4a4a; font-size: 1rem; }
    .gift-status { font-size: 0.85rem; color: #ff4757; font-weight: 600; margin-top: 4px; }

    .gift-card.unlocked { background: #ffffff; border: 2px solid #ff6b81; }
    .gift-card.unlocked .gift-status { color: #2ed573; }

    .reward-content {
      font-size: 0.9rem;
      color: #333;
      margin-top: 8px;
      font-weight: 600;
      word-break: break-word;
    }

    .final-gift-section {
      display: none;
      margin-top: 25px;
      width: 100%;
      background: #ffffff;
      border-radius: 25px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(255, 71, 87, 0.25);
      border: 3px dashed #ff4757;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .final-gift-section.active { display: block; }
    .final-gift-section h2 { color: #ff4757; font-size: 1.4rem; margin-bottom: 8px; }
    .final-gift-section p { color: #4a4a4a; font-size: 0.95rem; line-height: 1.5; }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* --- MODAL POPUP STYLING --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal {
      background: white;
      padding: 25px 20px;
      border-radius: 25px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 15px 35px rgba(0,0,0,0.25);
      text-align: center;
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
